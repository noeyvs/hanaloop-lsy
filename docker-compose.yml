services:
  postgres:
    image: postgres:15
    container_name: hanaloop-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hanaloop_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hanaloop_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-hanaloop}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hanaloop_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
